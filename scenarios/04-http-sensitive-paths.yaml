id: http-sensitive-paths
description: Request configuration files and admin pages with a scanner User-Agent.
kind: attack
steps:
  - http:
      requests:
        - {path: /.env, user_agent: "Mozilla/5.00 (Nikto/2.1.6)"}
        - {path: /.git/config, user_agent: "Mozilla/5.00 (Nikto/2.1.6)"}
        - {path: /wp-config.php.bak, user_agent: "Mozilla/5.00 (Nikto/2.1.6)"}
        - {path: /phpmyadmin/, user_agent: "Mozilla/5.00 (Nikto/2.1.6)"}
expect:
  detections: [HLAB-HTTP-001, HLAB-HTTP-002]
  min_events: 4
