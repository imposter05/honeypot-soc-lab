id: ssh-password-guessing
description: Six wrong passwords against the SSH decoy in test-credentials mode.
kind: attack
requires:
  ssh_auth_mode: test-credentials
steps:
  - ssh_logins:
      attempts:
        - {user: root, password: "123456"}
        - {user: root, password: password}
        - {user: admin, password: admin}
        - {user: root, password: toor}
        - {user: ubuntu, password: ubuntu}
        - {user: root, password: qwerty}
expect:
  detections: [HLAB-AUTH-001, HLAB-AUTH-002]
  forbidden: [HLAB-AUTH-003]
  min_events: 6
